name: HOUR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY_FILENAME }}" > oracle_key.pem
          chmod 600 oracle_key.pem

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Send Initialization Status
        env:
          STATUS_DISCORD_WEBHOOK: ${{ secrets.STATUS_DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "**OCI Provisioner (4-Hour Block) Initialized:** Starting polling loop (160 attempts / 90s interval)..."}' \
               "$STATUS_DISCORD_WEBHOOK"

- name: Run script in a loop (160 attempts / 90s delay)
        id: provision
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: oracle_key.pem
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_SHAPE: VM.Standard.A1.Flex
          STATUS_DISCORD_WEBHOOK: ${{ secrets.STATUS_DISCORD_WEBHOOK }}
        run: |
          ping_count=0
          for i in {1..160}; do
            echo "Attempt $i of 160..."
            OUTPUT=$(php index.php)
            echo "$OUTPUT"
            
            if [[ "$OUTPUT" != *"Out of host capacity"* && "$OUTPUT" != *"TooManyRequests"* && "$OUTPUT" != *"Error"* ]]; then
              echo "SUCCESS=true" >> $GITHUB_ENV
              exit 0
            fi

            # Status ping every 10 attempts (every 15 minutes)
            if [ $((i % 10)) -eq 0 ]; then
              ping_count=$((ping_count + 1))
              PAYLOAD=$(jq -n --arg count "$ping_count" '{"content": ("ℹ️ **OCI Poller Status Ping #" + $count + ":** Still running normally.")}')
              curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$STATUS_DISCORD_WEBHOOK" || true
            fi

            sleep 90
          done
          
      - name: Notify Discord on Success
        if: env.SUCCESS == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "**Oracle ARM Server Created Successfully! Huzzah!** Check your OCI dashboard."}' \
               "$DISCORD_WEBHOOK"
